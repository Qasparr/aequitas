<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aequitas — the balanced scales">
  <!-- AEQUITAS mark: the scales held level. The measure is the same both ways.
       Silhouette — one color (#000), transparent ground. Recolor freely. -->
  <g fill="#000000">
    <!-- finial orb -->
    <circle cx="256" cy="56" r="14"/>
    <!-- beam -->
    <rect x="88" y="84" width="336" height="18" rx="2"/>
    <!-- capital -->
    <rect x="212" y="102" width="88" height="20"/>
    <!-- pillar -->
    <rect x="244" y="122" width="24" height="300"/>
    <!-- base steps -->
    <rect x="176" y="422" width="160" height="22" rx="2"/>
    <rect x="156" y="444" width="200" height="18" rx="2"/>
    <!-- left pan -->
    <path d="M64,290 Q112,352 160,290 Z"/>
    <!-- right pan -->
    <path d="M344,290 Q392,352 440,290 Z"/>
  </g>
  <g stroke="#000000" stroke-width="7" stroke-linecap="round">
    <!-- left hangers -->
    <line x1="112" y1="102" x2="72" y2="290"/>
    <line x1="112" y1="102" x2="112" y2="290"/>
    <line x1="112" y1="102" x2="152" y2="290"/>
    <!-- right hangers -->
    <line x1="400" y1="102" x2="352" y2="290"/>
    <line x1="400" y1="102" x2="400" y2="290"/>
    <line x1="400" y1="102" x2="448" y2="290"/>
  </g>
</svg>
